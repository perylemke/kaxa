version: 2

project_name: kaxa

builds:
  - main: ./cmd/kaxa
    binary: kaxa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/perylemke/kaxa/internal/version.Version={{.Version}}
      - -X github.com/perylemke/kaxa/internal/version.Commit={{.Commit}}
      - -X github.com/perylemke/kaxa/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: install.sh
    - glob: install.ps1

# checksums.txt covers the archives and both install scripts. Signing it with
# cosign (keyless, tied to release.yml through GitHub OIDC) lets a user check that
# the file came from this repository's workflow, not only that it matches the
# archive next to it. The bundle is attached to the release.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

# One SPDX document per archive, made by syft.
sboms:
  - artifacts: archive

release:
  prerelease: auto
  extra_files:
    - glob: install.sh
    - glob: install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - "^style"

homebrew_casks:
  - name: kaxa
    binaries:
      - kaxa
    homepage: https://github.com/perylemke/kaxa
    description: Unified CLI for sandbox providers
    license: Apache-2.0
    directory: Casks
    skip_upload: auto
    commit_msg_template: "chore: update kaxa cask to {{ .Tag }}"
    repository:
      owner: perylemke
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # kaxa is not signed or notarized by Apple yet, so Gatekeeper would block the
    # binary. The quarantine flag is cleared until it is; the archive checksum and
    # signature (see docs/install.md) are the integrity check meanwhile.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kaxa"]
          end
