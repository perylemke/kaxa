version: 2

project_name: kaxa

builds:
  - main: ./cmd/kaxa
    binary: kaxa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/perylemke/kaxa/internal/version.Version={{.Version}}
      - -X github.com/perylemke/kaxa/internal/version.Commit={{.Commit}}
      - -X github.com/perylemke/kaxa/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: install.sh
    - glob: install.ps1

release:
  extra_files:
    - glob: install.sh
    - glob: install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - "^style"

homebrew_casks:
  - name: kaxa
    binaries:
      - kaxa
    homepage: https://github.com/perylemke/kaxa
    description: Unified CLI for sandbox providers
    license: Apache-2.0
    directory: Casks
    skip_upload: false
    commit_msg_template: "chore: update kaxa cask to {{ .Tag }}"
    repository:
      owner: perylemke
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kaxa"]
          end
