version: 2
updates:
  # Actions are pinned to commits; Dependabot opens a PR when a new release appears.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      go-modules:
        patterns:
          - "*"
