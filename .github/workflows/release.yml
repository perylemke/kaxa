name: Release

# Final tags (vX.Y.Z) publish the GitHub release and the Homebrew cask, with the
# notes taken from CHANGELOG.md. Pre-release tags (vX.Y.Z-alpha.N, -beta.N, -rc.N)
# publish a GitHub pre-release only: GoReleaser marks it as such and skips the cask.
#
# Every action is pinned to a commit. The Homebrew token reaches only the step that
# publishes a final version. The job runs in the "release" environment, where the
# repository settings can require a reviewer before the secrets are handed out.
# checksums.txt is signed with cosign (keyless) and attested, see docs/install.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc)\.[1-9][0-9]*$'; then
            echo "final=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi

      - name: Check the final tag is on main
        if: steps.tag.outputs.final == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::final tags must point to a commit on main"
            exit 1
          }

      # No build cache: a poisoned cache must not reach a release build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Release notes from CHANGELOG.md
        if: steps.tag.outputs.final == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./tools/changelog notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: GoReleaser (final)
        if: steps.tag.outputs.final == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # A pre-release publishes no cask. The empty value only keeps the template
      # in .goreleaser.yml valid; the token itself is not given to this step.
      - name: GoReleaser (pre-release)
        if: steps.tag.outputs.final != 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ""

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
